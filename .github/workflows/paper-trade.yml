name: Daily Paper Trade
on:
  schedule:
    - cron: "30 12 * * 1-5"     # 18:00 IST, Mon–Fri
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python paper_trade.py
      - run: |
          git config user.name  "paper-trade-bot"
          git config user.email "actions@github.com"
          git add output/paper_log.csv
          if git diff --staged --quiet; then
            echo "No new row to commit."
          else
            git commit -m "paper log: $(date -u +%Y-%m-%d)"
            git push
          fi
